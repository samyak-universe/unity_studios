<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unity Studios — Charge It Up</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .ad-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0;
    }

    .ad-wrapper img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="ad-wrapper">
    <img src="ad.png" alt="Unity Studios — Charge It Up" draggable="false" />
  </div>
</body>
</html>
